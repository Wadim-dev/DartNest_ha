<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>DartNest</title>
<style>
:root{--bg1:#0d0f14;--bg2:#1a1216;--card:rgba(255,255,255,.055);--line:rgba(255,255,255,.09);--txt:#f4f4f6;--sub:rgba(244,244,246,.62);
  --or:#ff8a3d;--rot:#ff4d5e;--gr:#3ddc84;--gelb:#ffc83d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:Outfit,Roboto,"Segoe UI",system-ui,sans-serif;color:var(--txt);background:radial-gradient(120% 90% at 0% 100%,#3a1d14 0%,transparent 55%),radial-gradient(90% 80% at 100% 0%,#2b1420 0%,transparent 60%),linear-gradient(160deg,var(--bg1),var(--bg2));
  font-size:1.6vh;-webkit-font-smoothing:antialiased;cursor:none}
.app{position:absolute;inset:0;display:flex;flex-direction:column;padding:2.6vh 3vw 3vh}
.top{display:flex;align-items:center;gap:2vw;height:6vh;flex:none}
.logo{display:flex;align-items:center;gap:.8vw;font-weight:800;font-size:2.6vh;letter-spacing:.02em}
.logo i{width:3.4vh;height:3.4vh;border-radius:50%;background:radial-gradient(circle,var(--rot) 0 18%,#fff 19% 30%,var(--or) 31% 52%,#fff 53% 63%,var(--rot) 64% 100%)}
.mitte{flex:1;text-align:center;font-size:2.3vh;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mitte b{color:var(--txt);font-weight:700}
.uhr{font-size:3vh;font-weight:700;font-variant-numeric:tabular-nums}
.punkt{width:1.2vh;height:1.2vh;border-radius:50%;background:var(--rot);display:none}
.weg .punkt{display:block}
.still .uhr{visibility:hidden}
main{flex:1;min-height:0;display:flex;flex-direction:column;gap:2.2vh;margin-top:2.2vh}
.grau{color:var(--sub)}
/* players */
.sp{flex:1;min-height:0;display:grid;gap:1.6vw}
.p{position:relative;border-radius:3vh;background:var(--card);border:.25vh solid var(--line);padding:2.4vh 2vw;display:flex;flex-direction:column;min-width:0;overflow:hidden;transition:border-color .3s,background .3s,transform .3s}
.p.an{border-color:var(--or);background:linear-gradient(160deg,rgba(255,138,61,.18),rgba(255,77,94,.08));box-shadow:0 0 0 .5vh rgba(255,138,61,.16),0 2vh 6vh rgba(0,0,0,.35)}
.p.raus{opacity:.4}
.n{display:flex;align-items:baseline;gap:1vw;font-size:3.6vh;font-weight:700;white-space:nowrap}
.n span{overflow:hidden;text-overflow:ellipsis}
.n small{margin-left:auto;font-size:2.4vh;color:var(--sub);font-weight:600;flex:none}.n small b{color:var(--txt);font-size:3vh}
.wf{font-size:2.2vh;color:var(--or);font-weight:600;margin-top:.4vh}
.gr{flex:1;display:flex;align-items:center;font-weight:800;line-height:.9;font-variant-numeric:tabular-nums;letter-spacing:-.02em;min-height:0}
.info{display:flex;gap:2vw;font-size:2.3vh;color:var(--sub);white-space:nowrap;overflow:hidden}
.info b{color:var(--txt);font-weight:700}
.wegp{display:flex;gap:.8vw;margin-top:1.2vh}
.wegp span,.chip{border-radius:1.2vh;padding:.5vh 1vw;font-weight:700;font-size:2.3vh;background:rgba(255,255,255,.08)}
.p.an .wegp span{background:var(--or);color:#1b0f08}
.marks{display:grid;grid-template-columns:repeat(7,1fr);gap:.5vw;margin:1.4vh 0}
.marks span{text-align:center;border-radius:1.2vh;padding:.6vh 0 .4vh;font-size:2.6vh;font-weight:800;background:rgba(255,255,255,.06);color:var(--sub);line-height:1.1}
.marks span i{display:block;font-style:normal;font-size:2.4vh;height:2.8vh;color:var(--or)}
.marks span.m3{background:var(--gr);color:#08180f}.marks span.m3 i{color:#08180f}
/* current visit */
.wurf{flex:none;display:flex;align-items:center;gap:2vw;border-radius:3vh;background:var(--card);border:.25vh solid var(--line);padding:2vh 2vw}
.wurf .wer{font-size:3vh;font-weight:700;min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wurf .wer small{display:block;font-size:2.2vh;color:var(--sub);font-weight:600}
.d{width:12vh;height:8.4vh;border-radius:2vh;display:flex;align-items:center;justify-content:center;font-size:4vh;font-weight:800;background:rgba(255,255,255,.07);border:.25vh solid var(--line)}
.d.leer{color:rgba(255,255,255,.25)}
.d.neu{animation:rein .45s cubic-bezier(.2,1.6,.4,1)}
.summe{font-size:6vh;font-weight:800;min-width:13vh;text-align:right;font-variant-numeric:tabular-nums}
.hinw{font-size:2.6vh;font-weight:700;color:var(--or)}
.hinw.bust{color:var(--rot)}.hinw.ok{color:var(--gr)}
/* rest mode */
.ruhe{flex:1;display:grid;grid-template-columns:1.05fr 1fr;gap:2.4vw;min-height:0}
.gross{display:flex;flex-direction:column;justify-content:center;gap:1vh;padding-left:1vw}
.gross .z{font-size:22vh;font-weight:800;line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.gross .dt{font-size:4vh;color:var(--sub);font-weight:600}
.gross .los{margin-top:4vh;font-size:3vh;font-weight:600}
.gross .los b{background:linear-gradient(90deg,var(--or),var(--rot));-webkit-background-clip:text;background-clip:text;color:transparent}
.box{border-radius:3vh;background:var(--card);border:.25vh solid var(--line);padding:2.4vh 2vw;min-height:0;overflow:hidden}
.box h3{font-size:2.2vh;text-transform:uppercase;letter-spacing:.12em;color:var(--sub);font-weight:700;margin-bottom:1.4vh}
.rechts{display:flex;flex-direction:column;gap:2vh;min-height:0}
.zeile{display:flex;align-items:center;gap:1.4vw;padding:1.1vh 0;border-top:.15vh solid var(--line);font-size:2.6vh;white-space:nowrap}
.zeile:first-of-type{border-top:none}
.zeile .nr{width:4vh;height:4vh;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:2.1vh;background:rgba(255,255,255,.08);flex:none}
.zeile:nth-of-type(1) .nr{background:var(--gelb);color:#231a00}.zeile:nth-of-type(2) .nr{background:#cfd6e0;color:#111}.zeile:nth-of-type(3) .nr{background:#d08a4a;color:#1f1206}
.zeile .nm{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.zeile .w{color:var(--sub);font-variant-numeric:tabular-nums}.zeile .w b{color:var(--txt)}
/* result */
.ende{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;text-align:center}
.ende .pokal{font-size:14vh;line-height:1;animation:rein .8s cubic-bezier(.2,1.6,.4,1)}
.ende h1{font-size:9vh;font-weight:800;line-height:1}
.ende h1 span{background:linear-gradient(90deg,var(--or),var(--rot));-webkit-background-clip:text;background-clip:text;color:transparent}
.tab{border-collapse:collapse;font-size:2.6vh;margin-top:2vh}
.tab th{font-size:2vh;color:var(--sub);font-weight:700;padding:.6vh 2vw;text-align:right}.tab th:first-child{text-align:left}
.tab td{padding:1vh 2vw;text-align:right;border-top:.15vh solid var(--line);font-variant-numeric:tabular-nums}.tab td:first-child{text-align:left;font-weight:700}
.tab tr.sieger td{color:var(--gr)}
/* bull-off */
.bo{flex:1;display:grid;gap:1.6vw;align-content:center}
/* dartboard next to the scoreboard */
main.mb{flex-direction:row;gap:2vw}
#inhalt{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:2.2vh}
#brett{display:none;position:relative;flex:none;align-self:center;border-radius:50%;isolation:isolate;background:#0b0c10;box-shadow:0 0 0 .4vh var(--line),0 2vh 6vh rgba(0,0,0,.4)}
main.mb #brett{display:block}
#brett svg{position:absolute;inset:0;width:100%;height:100%}
#brett .lv{position:absolute;inset:0;display:none;border-radius:50%;overflow:hidden;clip-path:circle(50%)}
#brett.kam .lv{display:block}#brett.kam .gz{display:none}
#brett .lv img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0;display:block}
#brett .gz text{font-size:19px;font-weight:700;fill:#e8e8ec;text-anchor:middle;font-family:Outfit,Roboto,Arial,sans-serif}
#brett .pf circle{stroke:#000;stroke-width:2.5}#brett .pf text{font-size:19px;font-weight:800;fill:#000;text-anchor:middle;font-family:Arial,sans-serif}
#brett .pf>g:last-child>.in{animation:rein .45s cubic-bezier(.2,1.6,.4,1);transform-box:fill-box;transform-origin:center}
#brett .bk{position:absolute;right:0;top:0;font-size:1.8vh;font-weight:700;color:#fff;background:rgba(0,0,0,.6);border-radius:1vh;padding:.4vh 1vw;white-space:nowrap}
#brett .bk:empty{display:none}
#brett.kam .pf circle{fill:none;stroke-width:5}#brett.kam .pf circle.u{fill:none;stroke:#000;stroke-width:9}
#brett.kam .pf .nr circle{stroke:#000;stroke-width:2}
main.mb .wurf{gap:1.2vw;padding:2vh 1.4vw}main.mb .wurf .wer{min-width:8vw}main.mb .wer .hinw{display:block;font-size:2.3vh;margin-top:.3vh}main.mb .d{width:10.5vh;font-size:3.4vh}main.mb .summe{font-size:5.4vh;min-width:9vh}
.hinw{white-space:nowrap}
/* effect overlay */
.fx{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:5}
.fx .t{font-weight:900;font-size:24vh;line-height:1;letter-spacing:-.02em;text-shadow:0 1vh 6vh rgba(0,0,0,.6);animation:fx 2.4s cubic-bezier(.2,1,.3,1) both;text-align:center}
.fx .t small{display:block;font-size:6vh;font-weight:800;letter-spacing:.06em;margin-top:1vh}
.fx .g180{background:linear-gradient(90deg,#ffd23d,var(--or),var(--rot));-webkit-background-clip:text;background-clip:text;color:transparent}
.fx .bust{color:var(--rot)}.fx .leg{color:var(--gr);font-size:13vh}
.blitz{position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle,rgba(255,170,70,.28),rgba(8,8,12,.78) 65%);animation:blitz 2.4s ease-out both}
/* next to the dartboard the banner stays over the players, so the board and its effects remain visible */
.fx.li{right:47%}.fx.li .t{font-size:17vh}.fx.li .leg{font-size:10vh}.fx.li .t small.hy{font-size:3.6vh}
.fx.li .blitz{background:radial-gradient(circle,rgba(255,170,70,.22),rgba(8,8,12,.72) 70%);-webkit-mask:linear-gradient(90deg,#000 80%,transparent);mask:linear-gradient(90deg,#000 80%,transparent)}
/* bust: no dark curtain, the melting board stays visible */
.blitz.hell{background:radial-gradient(circle,rgba(255,60,70,.16),rgba(8,8,12,.25) 70%)}
.fx .bust{font-size:15vh;text-shadow:0 .6vh 4vh rgba(0,0,0,.85)}
/* instant replay of a highlight clip */
#rp{position:absolute;left:50%;top:50%;width:min(72vh,60vw);transform:translate(-50%,-50%) scale(.9);opacity:0;transition:opacity .4s,transform .4s;z-index:6;pointer-events:none;
  border-radius:3vh;overflow:hidden;background:#000;box-shadow:0 0 0 .4vh rgba(255,138,61,.7),0 0 0 100vmax rgba(8,8,12,.6)}
#rp.an{opacity:1;transform:translate(-50%,-50%) scale(1)}
#rp video{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#000}
#rp .rl{position:absolute;left:0;right:0;top:0;padding:1.6vh 2vh;display:flex;align-items:center;gap:1.2vh;font-size:2.6vh;font-weight:800;background:linear-gradient(rgba(0,0,0,.75),transparent)}
#rp .rl i{width:1.4vh;height:1.4vh;border-radius:50%;background:var(--rot);animation:blink 1s steps(2) infinite}
#rp .rl b{margin-left:auto;background:linear-gradient(90deg,var(--or),var(--rot));-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes blink{50%{opacity:.2}}
/* overlay for OBS / Streamlabs: see-through, scoreboard at the bottom left */
body.ov{background:transparent!important;cursor:none}
.ov .app{display:none}
#ov{position:absolute;left:3vw;bottom:5vh;min-width:30vw;max-width:46vw;border-radius:1.6vh;overflow:hidden;background:rgba(13,15,20,.88);border:.2vh solid rgba(255,255,255,.12);box-shadow:0 2vh 6vh rgba(0,0,0,.45);display:none;font-variant-numeric:tabular-nums}
.ov #ov.da{display:block}
#ov .oh{display:flex;align-items:center;gap:1vh;padding:1vh 1.6vh;font-size:1.7vh;color:var(--sub);background:rgba(255,255,255,.05)}
#ov .oh i{width:1.8vh;height:1.8vh;border-radius:50%;flex:none;background:radial-gradient(circle,var(--rot) 0 18%,#fff 19% 30%,var(--or) 31% 52%,#fff 53% 63%,var(--rot) 64% 100%)}
#ov .oh b{color:var(--txt);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ov .oh span{margin-left:auto;display:flex;gap:0;white-space:nowrap}#ov .oh span em{font-style:normal;width:5.2vh;text-align:center}#ov .oh span em:last-child{width:9vh}
#ov .or{display:flex;align-items:center;padding:.9vh 1.6vh;border-top:.15vh solid rgba(255,255,255,.07);font-size:2.6vh;font-weight:700;position:relative}
#ov .or.an{background:linear-gradient(90deg,rgba(255,138,61,.28),rgba(255,138,61,.04))}
#ov .or.an:before{content:'';position:absolute;left:0;top:0;bottom:0;width:.6vh;background:var(--or)}
#ov .or.raus{opacity:.45}
#ov .on{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#ov .on small{font-size:1.7vh;color:var(--or);margin-left:1vh;font-weight:600}
#ov .os,#ov .ol{width:5.2vh;text-align:center;color:var(--sub)}#ov .ol{color:var(--txt)}
#ov .og{width:9vh;text-align:center;font-size:3.4vh;font-weight:800}
#ov .or.an .og{color:var(--or)}
#ov .of{display:flex;align-items:center;gap:.8vh;padding:1vh 1.6vh;border-top:.15vh solid rgba(255,255,255,.07);font-size:2.2vh}
#ov .of .od{min-width:6.4vh;text-align:center;border-radius:.8vh;padding:.4vh .6vh;background:rgba(255,255,255,.08);font-weight:800}
#ov .of .od.leer{color:rgba(255,255,255,.25)}
#ov .of .os2{margin-left:auto;font-size:2.8vh;font-weight:800}
#ov .of .hw{font-weight:700;color:var(--or);font-size:1.9vh}#ov .of .hw.bust{color:var(--rot)}#ov .of .hw.ok{color:var(--gr)}
#ov .of .co{display:flex;gap:.5vh}#ov .of .co span{border-radius:.7vh;padding:.3vh .7vh;background:var(--or);color:#1b0f08;font-weight:800;font-size:1.8vh}
#ov .sieg{padding:1.2vh 1.6vh;border-top:.15vh solid rgba(255,255,255,.07);font-size:2.6vh;font-weight:800}#ov .sieg span{background:linear-gradient(90deg,var(--or),var(--rot));-webkit-background-clip:text;background-clip:text;color:transparent}
.ov .fx .t{font-size:13vh}.ov .fx .t small{font-size:4vh}.ov .fx .leg{font-size:9vh}.ov .blitz{display:none}
.ov #rp{left:auto;right:3vw;top:5vh;width:28vw;transform:scale(.9);transform-origin:top right;box-shadow:0 0 0 .3vh rgba(255,138,61,.7),0 2vh 6vh rgba(0,0,0,.5)}.ov #rp.an{transform:none}
@keyframes fx{0%{opacity:0;transform:scale(.4)}15%{opacity:1;transform:scale(1.08)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
@keyframes blitz{0%{opacity:0}12%{opacity:1}80%{opacity:1}100%{opacity:0}}
@keyframes rein{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
/* live impact on the board: what happens depends on the dart and the game (kn = burst, brett classes = shake/glow) */
#brett .kl{position:absolute;inset:0;pointer-events:none;z-index:3}
.kn{position:absolute;width:0;height:0;--g:10vh;--r:0deg;--h:0deg;filter:hue-rotate(var(--h))}
.kn i{position:absolute;left:0;top:0;width:var(--g);height:var(--g);margin:calc(var(--g)/-2) 0 0 calc(var(--g)/-2);border-radius:50%;opacity:0;will-change:transform,opacity}
.kn .k{background:radial-gradient(circle,#fff 0,#fff4c2 14%,#ffb43a 32%,rgba(255,86,24,.55) 52%,rgba(255,60,20,0) 70%);animation:kn-k .7s cubic-bezier(.15,.9,.3,1) forwards}
.kn .w{border:calc(var(--g)*.035) solid #ffc46b;box-shadow:0 0 calc(var(--g)*.08) #ff9a3c;animation:kn-w .8s cubic-bezier(.1,.8,.3,1) forwards}
.kn .f{background:repeating-conic-gradient(from var(--r),#ffe2a0 0 3deg,transparent 3deg 24deg);-webkit-mask:radial-gradient(circle,transparent 22%,#000 34%,transparent 66%);mask:radial-gradient(circle,transparent 22%,#000 34%,transparent 66%);animation:kn-f .75s cubic-bezier(.1,.8,.3,1) forwards}
.kn.f2 .f{background:repeating-conic-gradient(from var(--r),#fff 0 1.5deg,transparent 1.5deg 13deg,#ffc46b 13deg 15deg,transparent 15deg 31deg)}
.kn.f3 .f{background:repeating-conic-gradient(from var(--r),#ffd27a 0 5deg,transparent 5deg 40deg)}
/* miss: grey dust, no fire */
.kn.staub .k{background:radial-gradient(circle,rgba(220,220,225,.75) 0,rgba(160,160,170,.4) 35%,transparent 68%);animation-duration:.9s}.kn.staub .w,.kn.staub .f{display:none}
/* double / bull: shock ring in the colour of the bed */
.kn.ring .w{border-color:#7dffb0;box-shadow:0 0 calc(var(--g)*.1) #2ee87a}.kn.ring .k{animation-duration:.5s}
.kn.rot .w{border-color:#ff8a80;box-shadow:0 0 calc(var(--g)*.1) #ff3d3d}
/* bust: the fire turns red and collapses */
.kn.bust .k{background:radial-gradient(circle,#fff 0,#ff8a80 20%,rgba(200,20,20,.6) 48%,transparent 70%);animation:kn-zu .8s ease-in forwards}.kn.bust .f{display:none}.kn.bust .w{border-color:#ff5252;animation-duration:.5s}
/* checkout: gold, longer, a second wave */
.kn.gold .k{background:radial-gradient(circle,#fff 0,#fff6d0 16%,#ffd54f 36%,rgba(255,170,0,.55) 54%,transparent 72%);animation-duration:1.1s}
.kn.gold .w{border-color:#ffe082;box-shadow:0 0 calc(var(--g)*.12) #ffc107;animation-duration:1.2s}.kn.gold .f{animation-duration:1.3s}
.kn .w2{animation-delay:.18s}
@keyframes kn-k{0%{opacity:1;transform:scale(.15)}25%{opacity:1}100%{opacity:0;transform:scale(1.25)}}
@keyframes kn-w{0%{opacity:.95;transform:scale(.2)}100%{opacity:0;transform:scale(2.4)}}
@keyframes kn-f{0%{opacity:1;transform:scale(.3) rotate(0)}100%{opacity:0;transform:scale(2) rotate(14deg)}}
@keyframes kn-zu{0%{opacity:1;transform:scale(.2)}30%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(.3)}}
/* the board reacts: small knock, big shake, "no" shake, zoom towards the dart before the big one */
#brett.b1{animation:b1 .28s ease-out}#brett.b2{animation:b2 .6s ease-out}#brett.b3{animation:b3 .9s ease-out}#brett.nein{animation:nein .5s ease-out}
@keyframes b1{30%{transform:translate(calc(var(--bx)*.4vh),calc(var(--by)*.4vh))}}
@keyframes b2{12%{transform:translate(calc(var(--bx)*1.2vh),calc(var(--by)*1.2vh)) scale(1.02)}30%{transform:translate(calc(var(--bx)*-.9vh),calc(var(--by)*-.7vh))}50%{transform:translate(calc(var(--bx)*.5vh),calc(var(--by)*.4vh))}70%{transform:translate(calc(var(--bx)*-.2vh),0)}}
@keyframes b3{0%{transform:scale(1)}22%{transform:scale(1.07)}28%{transform:translate(calc(var(--bx)*2vh),calc(var(--by)*2vh)) scale(1.05)}40%{transform:translate(calc(var(--bx)*-1.6vh),calc(var(--by)*-1.2vh)) scale(1.03)}55%{transform:translate(calc(var(--bx)*1vh),calc(var(--by)*.8vh))}70%{transform:translate(calc(var(--bx)*-.5vh),0)}85%{transform:translate(.2vh,0)}}
@keyframes nein{15%{transform:translateX(-1.4vh)}35%{transform:translateX(1.2vh)}55%{transform:translateX(-.8vh)}75%{transform:translateX(.4vh)}}
/* the visit runs hot (two trebles, on 180), the board glows; on a finish the target double pulses */
#brett{transition:box-shadow .6s}
#brett.heiss{box-shadow:0 0 0 .4vh #ff8a3d,0 0 5vh rgba(255,120,40,.55),0 2vh 6vh rgba(0,0,0,.4)}
#brett.goldrand{box-shadow:0 0 0 .5vh #ffd54f,0 0 7vh rgba(255,200,60,.7),0 2vh 6vh rgba(0,0,0,.4)}
#brett .zl{position:absolute;width:5.5vh;height:5.5vh;margin:-2.75vh 0 0 -2.75vh;border-radius:50%;border:.35vh solid #ffd54f;box-shadow:0 0 2vh #ffc107,inset 0 0 1.2vh rgba(255,213,79,.6);animation:zl 1.4s ease-in-out infinite;pointer-events:none;z-index:2}
#brett .zl.letzter{border-color:#fff;animation-duration:.9s}
@keyframes zl{0%,100%{transform:scale(.85);opacity:.55}50%{transform:scale(1.15);opacity:1}}
.blz{position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(circle at var(--x) var(--y),rgba(255,236,200,.75),rgba(255,160,60,.25) 35%,transparent 70%);animation:blz .6s ease-out forwards}
